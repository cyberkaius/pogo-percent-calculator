<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PoGo Percentage Calculator</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #3b82f6, #1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}


.container {
    display:flex;
    align-items:center;
    gap:40px;
}


.calculator {
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    width:540px;
}


h2 {
    text-align:center;
    margin:0;
    color:#ffcb05;
    font-size:32px;
    text-shadow:
        2px 2px #3b4cca,
        -1px -1px #3b4cca;
}


h3 {
    text-align:center;
    color:#333;
}


.stat-row {
    display:flex;
    align-items:center;
    gap:10px;
    margin:15px 0;
}


.stat-row label {
    width:75px;
    text-align:right;
    font-weight:bold;
}


input {
    display:none;
}


.bar {

    position:relative;

    flex:1;

    height:28px;

    background:#ddd;

    border-radius:20px;

    overflow:hidden;

    cursor:pointer;

    border:2px solid #999;

    background-image:
        linear-gradient(
            to right,
            transparent 32.8%,
            white 32.8%,
            white 33.8%,
            transparent 33.8%,
            transparent 66.1%,
            white 66.1%,
            white 67.1%,
            transparent 67.1%
        );

}



.fill {

    position:absolute;

    left:0;

    top:0;

    height:100%;

    width:0%;

    background:linear-gradient(
        90deg,
        #ffcb05,
        #f39a16
    );

    transition:width .35s ease;

}



.bar-text {

    position:absolute;

    width:100%;

    top:3px;

    text-align:center;

    font-weight:bold;

    color:#222;

    z-index:2;

}



#result {

    margin-top:25px;

    text-align:center;

    font-size:19px;

    line-height:1.8;

    background:#f1f5f9;

    padding:15px;

    border-radius:15px;

    border:3px solid #3b4cca;

}



.guide img {

    max-width:650px;

    border-radius:15px;

}



/* Mobile */

@media(max-width:800px){

    body{
        padding:20px 0;
    }


    .container{

        flex-direction:column;

        width:95%;

    }


    .calculator{

        width:100%;

        padding:20px;

        box-sizing:border-box;

    }


    .bar{

        width:100%;

    }


    .guide img{

        max-width:95vw;

    }

}

</style>
</head>


<body>

<div class="container">

<div class="calculator">

<h2>Pokemon Go</h2>
<h3>Percentage Calculator</h3>


<div class="stat-row">

<label>Attack</label>

<input id="num1" value="0">

<div class="bar" id="bar1">

<div class="fill" id="fill1"></div>

<div class="bar-text" id="barText1">
0 / 15
</div>

</div>

</div>


<div class="stat-row">

<label>Defense</label>

<input id="num2" value="0">

<div class="bar" id="bar2">

<div class="fill" id="fill2"></div>

<div class="bar-text" id="barText2">
0 / 15
</div>

</div>

</div>


<div class="stat-row">

<label>HP</label>

<input id="num3" value="0">

<div class="bar" id="bar3">

<div class="fill" id="fill3"></div>

<div class="bar-text" id="barText3">
0 / 15
</div>

</div>

</div>

<div id="result"></div>

</div>


<div class="guide">
<img src="stars.png" alt="Star Rating Guide">
</div>


</div>




<script>


function createBars(){

    for(let i = 1; i <= 3; i++){

        let bar = document.getElementById("bar"+i);


        bar.onclick = function(event){


            let rect = bar.getBoundingClientRect();


            let percent =
            (event.clientX - rect.left) / rect.width;


            let value =
            Math.round(percent * 15);


            value = Math.max(0, Math.min(15,value));


            document.getElementById("num"+i).value = value;


            calculate();


        };


    }

}




function updateBars(values){


    values.forEach((value,index)=>{


        document.getElementById("fill"+(index+1)).style.width =

            (value / 15 * 100) + "%";



        document.getElementById("barText"+(index+1)).innerHTML =

            value + " / 15";


    });


}




function calculate(){


    const inputs = [

        document.getElementById("num1"),

        document.getElementById("num2"),

        document.getElementById("num3")

    ];



    const values = inputs.map(input=>{


        let value = Number(input.value);



        if(isNaN(value)) value = 0;



        value = Math.max(0, Math.min(15,value));



        input.value = value;



        return value;


    });




    updateBars(values);




    const sum =
        values[0] + values[1] + values[2];



    const score = sum / 45;



    const raw = score * 100;



    const percentage = Math.round(raw);




    let stars;



    if(raw <= 48.9){

        stars = "⬛";

    }

    else if(raw <= 64.4){

        stars = "⭐";

    }

    else if(raw <= 80){

        stars = "⭐⭐";

    }

    else if(raw <= 97.8){

        stars = "⭐⭐⭐";

    }

    else{

        stars = "⭐⭐⭐⭐";

    }




    document.getElementById("result").innerHTML = `

        <strong>Sum:</strong> ${sum}<br>

        <strong>Score:</strong> ${score}<br>

        <strong>Percentage:</strong> ${percentage}%<br>

        <strong>Rating:</strong> ${stars}

    `;


}





createBars();

calculate();


</script>


</body>
</html>
